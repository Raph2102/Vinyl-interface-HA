<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#8a8a8a" />

    <!-- Ajout à l'écran d'accueil iOS : plein écran, sans barre Safari -->

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- .json plutôt que .webmanifest : Home Assistant sert les fichiers statiques
         avec les types MIME de Python, qui ne connaît pas toujours .webmanifest. -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-180.png" />

    <title>Vinyle</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
